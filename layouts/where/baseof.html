<!doctype html>
<html lang="en-AU">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ if eq .RelPermalink "/where/" }}Qooee Where — Your WFH hours, recorded{{ else }}{{ .Title }} | Qooee Where{{ end }}</title>
  <meta name="description" content="{{ .Description }}">
  <link rel="canonical" href="{{ .Permalink }}">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Qooee">
  <meta property="og:title" content="{{ .Title }}">
  <meta property="og:description" content="{{ .Description }}">
  <meta property="og:url" content="{{ .Permalink }}">
  <meta property="og:image" content="{{ "where/images/wfh-log.jpg" | absURL }}">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" type="image/svg+xml" href="{{ "where/images/qooee-icon.svg" | relURL }}">
  {{ with resources.Get "ananke/css/qooee-home.css" | minify | fingerprint }}<link rel="stylesheet" href="{{ .RelPermalink }}" integrity="{{ .Data.Integrity }}">{{ end }}
  {{ with resources.Get "ananke/css/qooee-where.css" | minify | fingerprint }}<link rel="stylesheet" href="{{ .RelPermalink }}" integrity="{{ .Data.Integrity }}">{{ end }}
</head>
<body class="qooee-body where-page">
  <a class="where-skip" href="#main">Skip to content</a>
  {{ partial "where-header.html" . }}
  <main id="main" tabindex="-1">{{ block "main" . }}{{ end }}</main>
  {{ partial "where-footer.html" . }}
</body>
</html>
